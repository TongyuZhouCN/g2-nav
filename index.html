<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>G2导航</title>
    <script type="module" crossorigin src="./assets/index-BGF3XKOZ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D8WpifJQ.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>G2导航 <span id="build-stamp" class="stamp">b29</span></h1>
          <p id="bridge-status" class="sub">正在检测眼镜连接…</p>
        </div>
        <div id="gps-pill" class="pill pill-wait">定位：等待中</div>
      </header>

      <section class="card">
        <label class="label" for="dest-input">目的地</label>
        <div class="search-row">
          <input id="dest-input" type="text" placeholder="输入地点，例如：宁波火车站" autocomplete="off" />
          <button id="voice-input-btn" type="button" class="mic" title="语音输入目的地">语音</button>
          <button id="search-btn" type="button">搜索</button>
        </div>
        <ul id="search-results" class="results"></ul>
        <p id="dest-chosen" class="chosen" hidden></p>
        <div id="recents" class="recents" hidden>
          <div class="label">最近去过</div>
          <div id="recents-list" class="chips"></div>
        </div>
      </section>

      <section class="card">
        <div class="label">出行方式</div>
        <div class="seg" id="mode-seg">
          <button type="button" data-mode="driving" class="seg-btn active">驾车</button>
          <button type="button" data-mode="walking" class="seg-btn">步行</button>
          <button type="button" data-mode="cycling" class="seg-btn">骑行</button>
        </div>
        <div id="route-list" class="routes"></div>
        <p id="route-hint" class="hint">先搜索并选择目的地，再选择路线。</p>
      </section>

      <section class="card controls">
        <button id="start-btn" type="button" class="primary" disabled>开始导航</button>
        <button id="stop-btn" type="button" class="secondary" disabled>结束导航</button>
        <label class="toggle">
          <input id="voice-toggle" type="checkbox" checked />
          <span>语音播报（手机发声）</span>
        </label>
        <label class="toggle">
          <input id="sim-toggle" type="checkbox" />
          <span>模拟导航（沿路线自动前进，用于室内测试）</span>
        </label>
      </section>

      <section class="card">
        <div class="label">眼镜预览 <span class="hint-inline">（眼镜上看到的就是这个画面）</span></div>
        <canvas id="preview" width="576" height="288"></canvas>
        <button id="view-btn" type="button" class="secondary">切换到大地图</button>
        <div class="zoom-row">
          <button id="zoom-out-btn" type="button" class="secondary">− 缩小</button>
          <button id="zoom-in-btn" type="button" class="secondary">+ 放大</button>
        </div>
        <div id="nav-readout" class="readout">未开始导航</div>
        <div id="map-source" class="readout">地图：—</div>
        <div id="imu-status" class="readout">头动：检测中…</div>
      </section>

      <section class="card">
        <div class="label">状态</div>
        <p id="gps-status" class="status-line">定位尚未启动。</p>
        <p id="app-log" class="log"></p>
      </section>

      <footer>
        地图数据 © OpenStreetMap 贡献者，底图瓦片 © 高德；路线由 OSRM 演示服务提供。
        本应用为个人开发测试版，演示服务有用量限制，请勿依赖其做唯一导航依据。
      </footer>
    </div>
  </body>
</html>
